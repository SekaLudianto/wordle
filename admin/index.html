<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dasbor Admin KATLA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        #comment-feed {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body class="bg-slate-100">

    <div class="container mx-auto p-4 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Kolom Kiri: Live Komentar -->
        <div class="lg:col-span-2 bg-white p-4 rounded-lg shadow-md">
            <h1 class="text-xl font-bold mb-4 border-b pb-2">Live Komentar TikTok</h1>
            <div id="comment-feed" class="h-96 overflow-y-auto pr-2 flex flex-col gap-3">
                <!-- Komentar akan muncul di sini -->
            </div>
        </div>

        <!-- Kolom Kanan: Info & Aksi Admin -->
        <div class="bg-white p-4 rounded-lg shadow-md flex flex-col gap-6">
            <div>
                <h2 class="text-lg font-bold text-slate-700">Jawaban Saat Ini</h2>
                <div id="target-word" class="mt-2 text-4xl font-extrabold tracking-widest uppercase text-center bg-slate-100 text-green-600 p-4 rounded-lg">
                    - - - - -
                </div>
            </div>

            <div>
                <h2 class="text-lg font-bold text-slate-700">Kirim Jawaban (sebagai HOST)</h2>
                <form id="guess-form" class="mt-2 flex gap-2">
                    <input type="text" id="guess-input" maxlength="5" placeholder="Ketik 5 huruf..." class="w-full border border-slate-300 rounded-md p-2 uppercase tracking-widest text-center focus:ring-2 focus:ring-sky-500 focus:outline-none">
                    <button type="submit" class="bg-sky-500 text-white font-bold py-2 px-4 rounded-md hover:bg-sky-600 transition-colors">Kirim</button>
                </form>
            </div>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${wsProtocol}//${window.location.host}`;
            let ws;

            const commentFeed = document.getElementById('comment-feed');
            const targetWordEl = document.getElementById('target-word');
            const guessForm = document.getElementById('guess-form');
            const guessInput = document.getElementById('guess-input');

            function connectWebSocket() {
                ws = new WebSocket(wsUrl);

                ws.onopen = () => {
                    console.log('Connected to WebSocket server as Admin');
                };

                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);

                    switch (data.type) {
                        case 'adminUpdate':
                            targetWordEl.textContent = data.targetWord || '?????';
                            break;
                        
                        case 'rawComment':
                            const commentEl = document.createElement('div');
                            commentEl.className = 'flex items-start gap-2 text-sm';
                            
                            const img = document.createElement('img');
                            img.src = data.profilePictureUrl;
                            img.className = 'w-8 h-8 rounded-full bg-slate-200';

                            const contentWrapper = document.createElement('div');
                            const nickname = document.createElement('p');
                            nickname.className = 'font-bold text-slate-800';
                            nickname.textContent = data.nickname;
                            
                            const commentText = document.createElement('p');
                            commentText.className = 'text-slate-600';
                            commentText.textContent = data.comment;

                            contentWrapper.appendChild(nickname);
                            contentWrapper.appendChild(commentText);
                            commentEl.appendChild(img);
                            commentEl.appendChild(contentWrapper);
                            
                            commentFeed.appendChild(commentEl);
                            // Auto-scroll to bottom
                            commentFeed.scrollTop = commentFeed.scrollHeight;
                            break;
                    }
                };

                ws.onclose = () => {
                    console.log('WebSocket disconnected. Reconnecting...');
                    setTimeout(connectWebSocket, 3000);
                };

                ws.onerror = (error) => {
                    console.error('WebSocket error:', error);
                    ws.close();
                };
            }

            guessForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const word = guessInput.value.trim();
                if (word.length === 5 && ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'adminGuess', word: word }));
                    guessInput.value = '';
                }
            });

            connectWebSocket();
        });
    </script>
</body>
</html>
