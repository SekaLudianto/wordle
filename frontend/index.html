<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KATLA - TikTok Live Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; touch-action: manipulation; }
        @keyframes flip { 0% { transform: rotateX(0deg); } 45% { transform: rotateX(90deg); } 55% { transform: rotateX(90deg); } 100% { transform: rotateX(0deg); } }
        .tile-flip { animation: flip 0.6s ease-in-out; }
        .tile {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            font-size: 1.75rem; /* Ukuran font tile diperkecil */
            font-weight: bold;
            line-height: 1;
            text-transform: uppercase;
            border: 2px solid #e2e8f0; /* slate-200 */
            transition: background-color 0.3s, border-color 0.3s, color 0.3s;
        }
        @keyframes toastIn { from { transform: translateY(150%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
        .toast-animation { animation: toastIn 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards, fadeOut 0.5s 4.5s forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col items-center justify-center min-h-screen p-2 sm:p-4 overflow-hidden">

    <div class="w-full max-w-xl mx-auto flex flex-col sm:flex-row items-start gap-4">
        <!-- Leaderboard (Kiri) -->
        <div id="leaderboard" class="w-full sm:w-48 bg-white p-3 rounded-xl shadow-sm order-2 sm:order-1 flex-shrink-0">
            <h2 class="font-bold text-center mb-2 text-slate-600 text-sm">PAPAN SKOR</h2>
            <div id="leaderboard-list" class="flex flex-col gap-1">
                <!-- Papan skor akan diisi oleh JavaScript -->
            </div>
        </div>

        <!-- Area Permainan (Kanan) -->
        <div id="app" class="w-full flex-grow flex flex-col gap-4 order-1 sm:order-2">
            <!-- Header -->
            <header class="text-center">
                <h1 class="text-4xl font-black tracking-tighter text-slate-800">KATLA</h1>
                <p class="text-slate-400 flex items-center justify-center gap-2 text-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-tiktok" viewBox="0 0 16 16"><path d="M9 0h1.98c.144.715.54 1.617 1.235 2.512C12.895 3.389 13.797 4 15 4v2c-1.753 0-3.07-.814-4-1.829V11a5 5 0 1 1-5-5v2a3 3> 0 1 0 3 3V0Z"/></svg>
                    <span>LIVE TIKTOK GAME</span>
                </p>
            </header>

            <!-- UI -->
            <div class="grid grid-cols-2 gap-3 text-center">
                <div class="bg-white p-3 rounded-xl shadow-sm flex flex-col justify-center"><div id="timer" class="text-3xl font-bold text-sky-500">10:00</div><div class="text-xs text-slate-400">SISA WAKTU</div></div>
                <div class="bg-white p-3 rounded-xl shadow-sm flex flex-col justify-center"><div id="best-guess-display" class="grid grid-cols-5 gap-1 mx-auto h-[36px]" style="width: calc(36px * 5 + 4 * 0.25rem);"></div><div id="best-guess-user" class="text-xs text-slate-400 truncate h-[16px] mt-2">TEBAKAN TERBAIK</div></div>
            </div>
            <div id="toast-container" class="h-8 flex flex-col-reverse items-center gap-2 overflow-hidden"></div>
            <div id="game-board" class="flex flex-col gap-1.5 w-full"></div>
            <div class="text-center text-slate-400 text-xs p-3 border border-slate-200 rounded-lg mt-2">Ketik kata 5 huruf di kolom komentar TikTok Live untuk menebak!</div>
        </div>
    </div>


    <!-- Modals -->
    <div id="answer-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-2xl shadow-lg p-6 text-center max-w-xs w-full transform transition-all scale-95 opacity-0" id="answer-modal-content">
            <h2 id="modal-title" class="text-xl font-bold mb-2 text-slate-800">Waktu Habis!</h2>
            <div id="winner-info" class="hidden"><p class="text-sm text-slate-500">dimenangkan oleh</p><p id="winner-nickname" class="text-2xl font-bold text-amber-500 my-1"></p><p class="text-slate-500 mb-3 text-sm">Total Kemenangan: <span id="winner-win-count" class="font-bold text-slate-700">0</span>x</p><hr class="border-slate-200 my-3"></div>
            <p class="text-slate-500 mb-2 text-sm">Kata yang benar adalah:</p><div id="correct-word" class="text-4xl font-black uppercase tracking-widest text-green-500 mb-3"></div><p id="word-meaning" class="text-slate-600 bg-slate-100 p-3 rounded-md text-xs"></p><p id="next-game-timer" class="text-xs text-slate-400 mt-5">Game baru akan dimulai sebentar lagi...</p>
        </div>
    </div>
    <div id="win-count-modal" class="fixed top-5 left-1/2 -translate-x-1/2 bg-white border-2 border-amber-400 rounded-2xl shadow-lg p-4 text-center max-w-xs w-full z-40 transition-all transform scale-95 opacity-0 hidden">
        <p class="text-base text-slate-600">
            <span id="win-count-nickname" class="font-bold text-slate-800 text-lg"></span>
        </p>
        <p class="text-slate-500 mt-1 text-sm">telah memenangkan permainan sebanyak</p>
        <p class="text-5xl font-black text-amber-400 my-1">
            <span id="win-count-number">0</span>x
        </p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const BACKEND_HOST = 'ahmad-wordle.onrender.com';

            const gameBoard = document.getElementById('game-board');
            const timerEl = document.getElementById('timer');
            const bestGuessDisplay = document.getElementById('best-guess-display');
            const bestGuessUserEl = document.getElementById('best-guess-user');
            const answerModal = document.getElementById('answer-modal');
            const answerModalContent = document.getElementById('answer-modal-content');
            const modalTitleEl = document.getElementById('modal-title');
            const correctWordEl = document.getElementById('correct-word');
            const wordMeaningEl = document.getElementById('word-meaning');
            const toastContainer = document.getElementById('toast-container');
            const winCountModal = document.getElementById('win-count-modal');
            const winCountNicknameEl = document.getElementById('win-count-nickname');
            const winCountNumberEl = document.getElementById('win-count-number');
            const winnerInfoEl = document.getElementById('winner-info');
            const winnerNicknameEl = document.getElementById('winner-nickname');
            const winnerWinCountEl = document.getElementById('winner-win-count');
            const leaderboardList = document.getElementById('leaderboard-list');

            const ROWS = 6;
            const COLS = 5;
            let nextGameInterval;
            let winCountTimeout;
            let gameHasEnded = false;

            function initializeUI() {
                gameBoard.innerHTML = '';
                for (let i = 0; i < ROWS; i++) {
                    const rowWrapper = document.createElement('div');
                    rowWrapper.className = 'flex items-center gap-2';
                    const tileContainer = document.createElement('div');
                    tileContainer.className = 'grid grid-cols-5 gap-1 flex-grow';
                    for (let j = 0; j < COLS; j++) {
                        const tile = document.createElement('div');
                        tile.className = 'tile w-full aspect-square rounded-md bg-white';
                        tileContainer.appendChild(tile);
                    }
                    // Wrapper untuk foto profil dan nama
                    const userWrapper = document.createElement('div');
                    userWrapper.className = 'w-24 flex items-center gap-1.5 opacity-0 transition-opacity duration-300';
                    
                    const imgEl = document.createElement('img');
                    imgEl.className = 'w-5 h-5 rounded-full bg-slate-200 object-cover flex-shrink-0';
                    imgEl.onerror = function() { this.style.display = 'none'; }; // Sembunyikan jika gambar gagal dimuat
                    
                    const nicknameEl = document.createElement('div');
                    nicknameEl.className = 'text-sm font-medium text-slate-500 text-left break-words';
                    nicknameEl.style.lineHeight = '1.2';

                    userWrapper.appendChild(imgEl);
                    userWrapper.appendChild(nicknameEl);
                    rowWrapper.appendChild(tileContainer);
                    rowWrapper.appendChild(userWrapper);
                    gameBoard.appendChild(rowWrapper);
                }
            }

            function updateBoard(guesses) {
                const reversedGuesses = [...guesses].reverse();
                const rows = gameBoard.querySelectorAll('.flex.items-center');
                rows.forEach((rowWrapper, rowIndex) => {
                    const tileContainer = rowWrapper.querySelector('.grid.grid-cols-5');
                    const userWrapper = rowWrapper.querySelector('.flex.items-center.gap-1\\.5');
                    const imgEl = userWrapper.querySelector('img');
                    const nicknameEl = userWrapper.querySelector('div');
                    const tiles = tileContainer.querySelectorAll('.tile');
                    const guessData = reversedGuesses[rowIndex];

                    if (guessData) {
                        userWrapper.classList.remove('opacity-0');
                        imgEl.src = guessData.profilePictureUrl;
                        imgEl.style.display = 'block';
                        nicknameEl.textContent = guessData.nickname || guessData.username;
                        
                        tiles.forEach((tile, tileIndex) => {
                            const letterData = guessData.result[tileIndex];
                            tile.textContent = letterData.letter;
                            
                            setTimeout(() => {
                                tile.classList.remove('bg-white');
                                if (letterData.status === 'green') tile.classList.add('bg-green-500', 'border-green-500', 'text-white');
                                else if (letterData.status === 'yellow') tile.classList.add('bg-amber-500', 'border-amber-500', 'text-white');
                                else if (letterData.status === 'gray') tile.classList.add('bg-slate-400', 'border-slate-400', 'text-white');
                                tile.classList.add('tile-flip');
                            }, tileIndex * 100);
                        });
                    } else {
                        userWrapper.classList.add('opacity-0');
                        tiles.forEach(tile => {
                            tile.textContent = '';
                            tile.className = 'tile w-full aspect-square rounded-md bg-white';
                        });
                    }
                });
            }
            
            function updateLeaderboard(leaderboardData) {
                leaderboardList.innerHTML = '';
                if (!leaderboardData || Object.keys(leaderboardData).length === 0) {
                    leaderboardList.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">Belum ada pemenang.</p>';
                    return;
                }

                // Ubah objek menjadi array dan urutkan
                const sortedPlayers = Object.values(leaderboardData)
                    .sort((a, b) => b.score - a.score)
                    .slice(0, 10);

                sortedPlayers.forEach((player, index) => {
                    const playerEl = document.createElement('div');
                    playerEl.className = 'flex items-center justify-between text-sm p-1.5 rounded-md ' + (index < 3 ? 'bg-amber-200' : '');
                    
                    const rankAndName = document.createElement('div');
                    rankAndName.className = 'flex items-center gap-2 overflow-hidden';
                    
                    const rank = document.createElement('span');
                    rank.className = 'font-bold w-5 text-slate-400 text-right flex-shrink-0';
                    rank.textContent = `${index + 1}.`;

                    // Tambahkan foto profil di leaderboard
                    const img = document.createElement('img');
                    img.src = player.profilePictureUrl;
                    img.className = 'w-5 h-5 rounded-full object-cover flex-shrink-0';
                    img.onerror = function() { this.style.display = 'none'; };
                    
                    const name = document.createElement('span');
                    name.className = 'font-medium text-slate-700 truncate';
                    name.textContent = player.nickname; // Tampilkan nickname
                    
                    rankAndName.appendChild(rank);
                    rankAndName.appendChild(img);
                    rankAndName.appendChild(name);
                    
                    const scoreEl = document.createElement('span');
                    scoreEl.className = 'font-bold text-slate-800 flex-shrink-0';
                    scoreEl.textContent = player.score;

                    playerEl.appendChild(rankAndName);
                    playerEl.appendChild(scoreEl);
                    leaderboardList.appendChild(playerEl);
                });
            }

            function updateTimer(seconds) {
                const minutes = Math.floor(seconds / 60);
                const remainingSeconds = seconds % 60;
                timerEl.textContent = `${String(minutes).padStart(2, '0')}:${String(remainingSeconds).padStart(2, '0')}`;
            }
            
            function updateBestGuess(bestGuess) {
                bestGuessDisplay.innerHTML = '';
                if (bestGuess && bestGuess.result) {
                    bestGuess.result.forEach(letterData => {
                        const tile = document.createElement('div');
                        const statusColor = { 
                            green: 'bg-green-500 border-green-500 text-white', 
                            yellow: 'bg-amber-500 border-amber-500 text-white', 
                            gray: 'bg-slate-400 border-slate-400 text-white' 
                        }[letterData.status] || 'bg-white border-slate-200';
                        tile.className = `w-full h-full rounded-md flex items-center justify-center text-lg font-bold uppercase ${statusColor}`;
                        tile.textContent = letterData.letter;
                        bestGuessDisplay.appendChild(tile);
                    });
                    bestGuessUserEl.textContent = `OLEH ${bestGuess.nickname || bestGuess.username}`;
                } else {
                    for (let i = 0; i < 5; i++) {
                        const tile = document.createElement('div');
                        tile.className = 'w-full h-full rounded-md border-2 border-slate-200 bg-white';
                        bestGuessDisplay.appendChild(tile);
                    }
                    bestGuessUserEl.textContent = 'TEBAKAN TERBAIK';
                }
            }
            
            function showToast(message) {
                while (toastContainer.firstChild) { toastContainer.removeChild(toastContainer.firstChild); }
                const toast = document.createElement('div');
                toast.className = 'bg-slate-800 text-white text-xs py-2 px-4 rounded-full shadow-lg toast-animation max-w-full truncate';
                toast.textContent = message;
                toastContainer.appendChild(toast);
                setTimeout(() => { if(toast.parentElement) { toast.parentElement.removeChild(toast); } }, 5000);
            }

            function showAnswer(word, meaning, isWinner = false, nickname = '', winCount = 0) {
                gameHasEnded = true;
                clearInterval(nextGameInterval);
                if (isWinner) {
                    modalTitleEl.textContent = "Selamat!";
                    winnerNicknameEl.textContent = nickname;
                    winnerWinCountEl.textContent = winCount;
                    winnerInfoEl.classList.remove('hidden');
                } else {
                    modalTitleEl.textContent = "Waktu Habis!";
                    winnerInfoEl.classList.add('hidden');
                }
                correctWordEl.textContent = word;
                wordMeaningEl.textContent = meaning;
                answerModal.classList.remove('hidden');
                setTimeout(() => answerModalContent.classList.remove('scale-95', 'opacity-0'), 10);
                let countdown = 15;
                const nextGameTimerEl = document.getElementById('next-game-timer');
                nextGameTimerEl.innerHTML = `Game baru dimulai dalam <span class="font-bold text-slate-700">${countdown}</span> detik...`;
                nextGameInterval = setInterval(() => {
                    countdown--;
                    if (countdown > 0) {
                        nextGameTimerEl.innerHTML = `Game baru dimulai dalam <span class="font-bold text-slate-700">${countdown}</span> detik...`;
                    } else {
                        clearInterval(nextGameInterval);
                        nextGameTimerEl.textContent = 'Memulai game baru...';
                    }
                }, 1000);
            }

            function hideAnswer() {
                 clearInterval(nextGameInterval);
                 answerModalContent.classList.add('scale-95', 'opacity-0');
                 setTimeout(() => answerModal.classList.add('hidden'), 300);
            }
            
            function showWinCountModal(nickname, winCount) {
                clearTimeout(winCountTimeout);
                winCountNicknameEl.textContent = nickname;
                winCountNumberEl.textContent = winCount;
                winCountModal.classList.remove('hidden');
                setTimeout(() => winCountModal.classList.remove('opacity-0', 'scale-95'), 10);
                winCountTimeout = setTimeout(() => {
                    winCountModal.classList.add('opacity-0', 'scale-95');
                    setTimeout(() => winCountModal.classList.add('hidden'), 300);
                }, 7000);
            }

            function resetForNewGame() {
                hideAnswer();
                initializeUI();
                updateTimer(600);
                updateBestGuess(null);
            }

            function connectWebSocket() {
                const wsUrl = `wss://${BACKEND_HOST}`;
                const ws = new WebSocket(wsUrl);
                ws.onopen = () => showToast('Terhubung ke server game!');
                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    switch (data.type) {
                        case 'gameState':
                            if (gameHasEnded) {
                                resetForNewGame();
                                gameHasEnded = false;
                            }
                            updateBoard(data.guesses);
                            updateTimer(data.timeLeft);
                            updateBestGuess(data.bestGuess);
                            break;
                        case 'message': showToast(data.content); break;
                        case 'answer': showAnswer(data.word, data.meaning, false); break;
                        case 'winner': showAnswer(data.word, data.meaning, true, data.nickname, data.winCount); break;
                        case 'showWinCount': showWinCountModal(data.nickname, data.winCount); break;
                        case 'leaderboardUpdate': updateLeaderboard(data.leaderboard); break;
                    }
                };
                ws.onclose = () => setTimeout(connectWebSocket, 3000);
                ws.onerror = (error) => { console.error('WebSocket error:', error); ws.close(); };
            }
            
            function initializeGame() {
                initializeUI();
                connectWebSocket();
                fetch(`https://${BACKEND_HOST}/api/game-state`)
                    .then(res => res.json())
                    .then(data => {
                        updateBoard(data.guesses || []);
                        updateTimer(data.timeLeft || 600);
                        updateBestGuess(data.bestGuess || null);
                    });
                fetch(`https://${BACKEND_HOST}/api/leaderboard`)
                    .then(res => res.json())
                    .then(data => {
                        updateLeaderboard(data);
                    });
            }
            initializeGame();
        });
    </script>
</body>
</html>
